<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma liste de tâches</title>
  <!-- Le "?v=..." est un numéro de version : à changer à chaque mise à jour
       pour que le navigateur recharge les fichiers au lieu d'utiliser les anciens -->
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <main class="carte">
    <h1>Ma liste de tâches</h1>

    <!-- Zone de saisie : un champ texte + une date d'échéance et une catégorie (facultatives) + un bouton -->
    <form id="formulaire">
      <input type="text" id="champ-tache" placeholder="Écris une tâche..." autocomplete="off">
      <input type="date" id="champ-echeance" title="Date d'échéance (facultative)">
      <select id="champ-categorie" title="Catégorie (facultative)">
        <option value="">Sans catégorie</option>
        <option value="maison">Maison</option>
        <option value="courses">Courses</option>
        <option value="pro">Professionnel</option>
      </select>
      <button type="submit" id="bouton-ajouter">Ajouter</button>
    </form>

    <!-- Les boutons de filtre : n'afficher qu'une catégorie à la fois -->
    <div id="filtres">
      <button type="button" class="filtre actif" data-filtre="toutes">Toutes</button>
      <button type="button" class="filtre" data-filtre="maison">Maison</button>
      <button type="button" class="filtre" data-filtre="courses">Courses</button>
      <button type="button" class="filtre" data-filtre="pro">Professionnel</button>
    </div>

    <!-- La liste où les tâches vont apparaître -->
    <ul id="liste"></ul>

    <!-- Bas de la liste : le compteur et le bouton pour effacer les tâches faites -->
    <div id="pied">
      <p id="compteur"></p>
      <button id="effacer-terminees" hidden>Effacer les tâches terminées</button>
    </div>
  </main>

  <script src="script.js?v=8"></script>
</body>
</html>
